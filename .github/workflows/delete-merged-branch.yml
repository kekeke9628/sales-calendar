name: Delete merged branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: claude/sales-calendar-connection-8bjaui
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "이미 삭제된 브랜치입니다: $BRANCH"
            exit 0
          fi
          status=$(gh api "repos/$REPO/compare/main...$BRANCH" --jq '.status')
          echo "main 대비 상태: $status"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "main에 머지되지 않은 커밋이 있어 삭제하지 않습니다."
            exit 1
          fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "삭제 완료: $BRANCH"
